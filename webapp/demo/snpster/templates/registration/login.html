{% extends "base.html" %}

{% block title %}Log in | SNPster{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h1>Log in</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="button button-primary">
                Log in
            </button>
        </form>
    </div>
</section>
{% endblock %}
