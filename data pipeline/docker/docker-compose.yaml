services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zod50902
      POSTGRES_DB: snpster_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      PGDATA: /var/lib/postgresql/data/pgdata # this is for defining the location of the data directory inside the container
    ports:
      - '5433:5432'
    volumes:
      - ./data:/var/lib/postgresql/data #volume for persisting data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql #this is for defining the DB structure (schema + indexing etc)
    restart: always
    
  